name: Publish Platydoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Initialize the data repository and its XNU source only
        run: |
          git submodule update --init platydoc-data
          git -C platydoc-data submodule update --init xnu

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install handbook rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmark-gfm graphviz ripgrep
          python -m pip install -r docs-ai/tools/book/requirements.txt

      - name: Download the pinned layout data package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs-ai/tools/layouts/prepared.py download --reference runtime/prepared-layouts.release.json --output .docs-cache/layouts/prepared-layouts.tar.gz

      - uses: actions/configure-pages@v5

      - name: Render the handbook with the prepared Wasm runtime
        env:
          DOCS_DIAGRAM_RENDERER: parsed-svg
          PYTHONDONTWRITEBYTECODE: "1"
        run: python make_docs.py --prepared-layouts .docs-cache/layouts/prepared-layouts.tar.gz --publish-only

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs-ai-html

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
